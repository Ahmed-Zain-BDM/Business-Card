<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ahmed Zain  Alabdin | Digital Business Card</title>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --primary: #e6c90f;
      --text: #ffffff;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.12);
      --surface: rgba(255, 255, 255, 0.04);
      --glass: rgba(17, 24, 39, 0.92);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px 16px; }
    .card-container { width: 100%; max-width: 440px; background: var(--glass); border: 1px solid var(--border); border-radius: 24px; padding: 30px 22px; backdrop-filter: blur(16px); box-shadow: 0 20px 45px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; }
    .company-banner { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); padding: 10px 24px; border-radius: 30px; }
    .company-logo-img { max-height: 50px; max-width: 150px; object-fit: contain; }
    .company-logo-text { font-size: 1.05rem; font-weight: 800; color: var(--primary); letter-spacing: 0.8px; }
    .avatar-box { width: 95px; height: 95px; border-radius: 50%; border: 3px solid var(--primary); padding: 3px; background: #1e293b; margin-bottom: 14px; overflow: hidden; }
    .avatar-box img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .profile-name { font-size: 1.45rem; font-weight: 800; margin-bottom: 4px; text-align: center; }
    .profile-title { font-size: 0.88rem; color: var(--text-muted); font-weight: 600; margin-bottom: 22px; text-align: center; }
    .btn-save-vcard { width: 100%; background: var(--primary); color: #000; font-size: 1rem; font-weight: 800; border: none; padding: 14px; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.35); margin-bottom: 14px; }
    .actions-list { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .action-item { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; color: var(--text); text-decoration: none; font-size: 0.92rem; font-weight: 600; }
    .save-options { width: 100%; padding-top: 14px; border-top: 1px solid var(--border); }
    .utility-btn { width: 100%; padding: 12px 10px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border); color: var(--text-muted); border-radius: 12px; font-size: 0.85rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  </style>
</head>
